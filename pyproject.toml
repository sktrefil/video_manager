[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-manager"
version = "0.1.0"
description = "Shared-frame video boundary inspection and timing tools"
requires-python = ">=3.11"
dependencies = ["Pillow==11.1.0", "numpy==2.2.3", "opencv-python-headless==4.11.0.86"]

[project.optional-dependencies]
gui = ["PySide6==6.8.2.1"]

[project.scripts]
video-manager = "video_manager.cli:main"
video-frame-capture = "video_manager.ui.frame_capture:main"
video-enhancer = "video_manager.ui.batch_enhancer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"video_manager.ui" = ["video_enhancements_help.html"]
